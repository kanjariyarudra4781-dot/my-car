<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Static Website</title>
    <!-- Link to external CSS stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="container">
            <h1>Welcome to My Website</h1>
            <p>Hosted for free using GitHub Pages</p>
        </div>
    </header>

    <main class="container">
        <section class="card">
            <h2>About This Site</h2>
            <p>This is a clean, responsive static website built with pure HTML, CSS, and JavaScript. You can edit these files locally in Notepad and push them straight to GitHub!</p>
            <button id="colorBtn">Click Me to Change Background</button>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 My Website. Built with Notepad.</p>
    </footer>

    <!-- Link to external JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
